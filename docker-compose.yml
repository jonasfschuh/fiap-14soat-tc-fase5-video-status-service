version: '3.8'
name: ms-video-status
services:

  # ─── Video Status API ────────────────────────────────────────────────────
  video-status-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-status-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5434/video_status_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8084
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: fiapx
      RABBITMQ_USER: fiapx
      RABBITMQ_PASSWORD: fiapx123
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-api:8090}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: video-status-ms-local
    ports:
      - "8084:8084"
    networks:
      - app-network
      - fiap-network
    restart: unless-stopped

  # ─── Adminer (DB UI) ─────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: adminer-video-status
    environment:
      ADMINER_DEFAULT_SERVER: host.docker.internal:5434
    ports:
      - "8094:8080"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
  fiap-network:
    external: true
    name: fiap-network
