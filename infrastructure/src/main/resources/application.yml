spring:
  application:
    name: video-status-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/video_status_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:fiapx}
    username: ${RABBITMQ_USER:fiapx}
    password: ${RABBITMQ_PASSWORD:fiapx123}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8090}

swagger:
  server:
    url: ${SWAGGER_SERVER_URL:/}

logging:
  level:
    br.com.fiap: INFO
    org.springframework: WARN

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  rabbitmq:
    dynamic: false
    listener:
      simple:
        auto-startup: false

auth:
  service:
    url:

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-video-status:5432/video_status_db}
  rabbitmq:
    host: ${RABBITMQ_HOST:fiap-rabbitmq}

---
spring:
  config:
    activate:
      on-profile: k8s

# O ingress reescreve /status(/|$)(.*) -> /$2, entao o app recebe as
# requisicoes sem o prefixo /status. O Swagger UI roda no browser e
# precisa dos paths completos (com prefixo) para que o ingress roteie
# corretamente as chamadas de api-docs/config feitas pelo JS da pagina.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    config-url: /status/v3/api-docs/swagger-config
    url: /status/v3/api-docs

